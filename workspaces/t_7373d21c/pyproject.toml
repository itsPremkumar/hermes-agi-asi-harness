[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcptest"
version = "1.0.0"
description = "Automated MCP Server Testing Framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Prem Kumar", email = "premkumar@example.com" },
]
keywords = ["mcp", "testing", "conformance", "fuzzing", "security", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-html>=4.0.0",
    "pytest-json-report>=1.5.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=4.0.0",
    "pytest-json-report>=1.5.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[project.scripts]
mcptest = "mcptest.cli:main"

[project.urls]
Homepage = "https://github.com/itsPremkumar/mcptest"
Repository = "https://github.com/itsPremkumar/mcptest"

[tool.hatch.build.targets.wheel]
packages = ["src/mcptest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
