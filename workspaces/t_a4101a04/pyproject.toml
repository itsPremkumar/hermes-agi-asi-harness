[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codereview-bot"
version = "1.0.0"
description = "Automated Pull Request Review — GitHub App with AI-powered code review, static analysis, security scanning, and custom rule engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Prem Kumar"}]
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "cryptography>=41.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
codereview-bot = "codereview_bot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codereview_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
