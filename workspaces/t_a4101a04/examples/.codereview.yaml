# CodeReview Bot Configuration Example
# Place this file in your repository root as `.codereview.yaml`

enabled: true

rules:
  # Ban TODO/FIXME comments
  - id: CUSTOM001
    pattern: 'TODO|FIXME'
    message: "Found TODO/FIXME comment — track in issue tracker"
    severity: info
    enabled: true

  # Ban console.log in production code
  - id: CUSTOM002
    pattern: 'console\.(log|debug|warn|error)'
    message: "Avoid console statements in production code"
    severity: warning
    files: '.*\.(js|ts|jsx|tsx)$'
    exclude: '.*(test|spec).*'
    enabled: true

  # Ban debugger statements
  - id: CUSTOM003
    pattern: 'debugger'
    message: "Remove debugger statement before merging"
    severity: error
    enabled: true

  # Require type annotations in TypeScript
  - id: CUSTOM004
    pattern: 'function\s+\w+\s*\([^)]*\)\s*\{'
    message: "Consider adding return type annotation"
    severity: info
    files: '.*\.(ts|tsx)$'
    enabled: true

  # Ban any type in TypeScript
  - id: CUSTOM005
    pattern: ':\s*any\b'
    message: "Avoid using 'any' type — use specific types"
    severity: warning
    files: '.*\.(ts|tsx)$'
    enabled: true
