# CodeReview Bot GitHub App Manifest
# Users install this app on their repos to enable automated PR review

# The name of the GitHub App
name: CodeReview Bot
# The homepage URL
url: https://github.com/itsPremkumar/codereview-bot
# A description of the GitHub App
description: Automated Pull Request Review with AI-powered code analysis

# The configuration of the GitHub App
# Set to true to receive webhook events
active: true
# The list of events the GitHub App subscribes to
events:
  - pull_request
  - pull_request_review
  - check_run

# The set of permissions needed by the GitHub App
permissions:
  # Need to read pull requests and their diffs
  pull_requests: write
  # Need to create check runs
  checks: write
  # Need to read repository contents
  contents: read
  # Need to read metadata
  metadata: read

# The list of repositories where the GitHub App should be installed
# Leave empty for all repositories
# repositories:
#   - owner/repo
