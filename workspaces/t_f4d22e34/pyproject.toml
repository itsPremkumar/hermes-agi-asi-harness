[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ml-knowledge-graph"
version = "1.0.0"
description = "AI/ML Knowledge Graph with 16 verticals, agent coordination protocols, and ADRs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Prem Kumar"}]
dependencies = [
    "PyYAML>=6.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
