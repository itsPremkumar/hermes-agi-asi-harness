[project]
name = "gridmind-ai-platform"
version = "1.0.0"
description = "AI-Powered Smart Grid Management Platform — Load Prediction, Fault Detection, Renewable Integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[dependencies]
fastapi = ">=0.100"
uvicorn = ">=0.23"
redis = ">=4.5"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
torch = ">=2.0"
numpy = ">=1.24"
scipy = ">=1.10"
joblib = ">=1.3"
prometheus-client = ">=0.17"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-mock", "black", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridmind"]
