# Example TestPilot Configuration
project_name: example-project
root_dir: ./src
output_dir: ./testpilot-output

# Quality gate thresholds
min_coverage_percent: 80.0
max_flaky_rate: 0.05
max_p95_latency_ms: 500.0
max_failure_rate: 0.01

# Analysis settings
analyze_paths:
  - ./src
exclude_patterns:
  - "*/tests/*"
  - "*/test/*"
  - "*/__pycache__/*"

# E2E settings
browser: chromium
headless: true
base_url: http://localhost:3000

# Visual regression
visual_threshold: 0.1

# Performance
perf_tool: locust
perf_users: 50
perf_duration: 30s

# Contract testing
pact_dir: ./pacts
provider_base_url: http://localhost:8080
