[project]
name = "testpilot"
version = "1.0.0"
description = "AI-Powered Test Generation Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Prem Kumar" },
]
keywords = ["testing", "qa", "automation", "ai", "playwright", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.2",
    "pytest-rerunfailures>=13",
    "pytest-html>=4.1",
    "allure-pytest>=2.13",
    "playwright>=1.40",
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "httpx>=0.26",
    "structlog>=24.1",
    "tomli>=2.0; python_version<'3.11'",
    "astroid>=3.0",
    "networkx>=3.2",
    "jmespath>=1.0",
    "diff-match-patch>=202310",
    "pillow>=10.2",
    "faker>=22.0",
    "jsonschema>=4.21",
    "packaging>=23.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "bandit>=1.7",
]

[project.scripts]
testpilot = "testpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testpilot", "testpilot.plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests",
    "integration: integration tests",
    "unit: unit tests",
    "visual: visual regression tests",
    "contract: contract tests",
    "performance: performance tests",
    "flaky: flaky test detection",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
