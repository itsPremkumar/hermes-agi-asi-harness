apiVersion: v1
kind: Service
metadata:
  name: contextvault
  namespace: contextvault
  labels:
    app: contextvault
    component: memory-store
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  selector:
    app: contextvault
