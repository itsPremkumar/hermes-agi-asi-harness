apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contextvault-ingress
  namespace: contextvault
  labels:
    app: contextvault
    component: memory-store
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: contextvault.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: contextvault
            port:
              number: 80
