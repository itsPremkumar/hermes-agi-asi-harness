apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextvault
  namespace: contextvault
  labels:
    app: contextvault
    component: memory-store
  annotations: {}
spec:
  replicas: 3
  selector:
    matchLabels:
      app: contextvault
  template:
    metadata:
      labels:
        app: contextvault
        component: memory-store
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: contextvault-sa
      containers:
      - name: contextvault
        image: contextvault:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        envFrom:
        - configMapRef:
            name: contextvault-config
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: contextvault-data
      nodeSelector: null
      tolerations: null
