[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch"
version = "1.0.0"
description = "Autonomous Scientific Research Agent — multi-agent pipeline for paper discovery, synthesis, hypothesis generation, and LaTeX paper writing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DeepResearch Engine", email = "research@deepresearch.dev"}]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
deepresearch = "deepresearch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepresearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -v"
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["deepresearch"]
omit = ["*/tests/*"]
