# tox.ini — Local CI orchestration
# Run: tox -p  (parallel) or tox (sequential)

[tox]
envlist = py311,py312,lint,typecheck,security
skip_missing_interpreters = True
isolated_build = True

[testenv]
deps =
    pytest>=8.3.0
    pytest-cov>=4.0
    pytest-asyncio>=0.23.0
    pytest-xdist>=3.5.0
commands =
    pytest tests/ -x -q --cov=src/harness --cov-report=term-missing {posargs}
description = Run tests with coverage

[testenv:lint]
deps =
    ruff>=0.5.0
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/
description = Run linter and format check

[testenv:typecheck]
deps =
    mypy>=1.10.0
commands =
    mypy src/harness/
description = Run type checker

[testenv:security]
deps =
    bandit>=1.7.0
    pip-audit>=2.6.0
commands =
    bandit -r src/ -c pyproject.toml
    pip-audit -r requirements.txt
description = Run security scans

[testenv:docs]
deps =
    mkdocs>=1.6.0
    mkdocs-material>=9.5.0
commands =
    mkdocs build
description = Build documentation

[testenv:clean]
deps =
commands =
    rm -rf .tox/ htmlcov/ .coverage coverage.xml build/ dist/ *.egg-info
description = Clean all generated artifacts

# ===== pytest config (used by tox) =====
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -x
asyncio_mode = auto

[coverage:run]
source = src/harness
branch = true

[coverage:report]
show_missing = true
fail_under = 80
