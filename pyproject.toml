[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-agi-asi-harness"
version = "2.1.0"
description = "Hermes AGI/ASI Harness — free-first, modular, model-agnostic agent harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes AGI/ASI Contributors"},
]
keywords = ["agi", "asi", "agent", "harness", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "ddgs>=9.0.0",
    "psutil>=5.9.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black",
    "ruff",
    "mypy",
]
research = [
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
]
langgraph = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
]
deepagents = [
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
]
ollama = ["ollama>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
huggingface = ["transformers>=4.0", "torch>=2.0"]
browser = ["playwright>=1.40"]
all = [
    "ollama>=0.2",
    "openai>=1.0",
    "anthropic>=0.30",
    "transformers>=4.0",
    "playwright>=1.40",
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
]

[project.scripts]
hermes-agi = "hermes_agi:main"

[tool.setuptools]
py-modules = ["hermes_agi"]

[tool.setuptools.packages.find]
include = ["core*", "plugins*", "agents*", "tools*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pragmatic ruleset: catch real bugs, ignore style noise for a research codebase.
select = ["F", "E7", "E9", "UP", "SIM", "S", "ASYNC", "DTZ", "BLE", "PLW", "PERF", "RUF"]
ignore = [
    "BLE001",   # blind except is intentional at plugin boundaries
    "S110",     # try/except/pass used deliberately for best-effort cleanup
    "S112",     # try/except/continue likewise
    "S301",     # pickle usage audited & gated behind trusted-store flags
    "PLW1510",  # subprocess without check is intentional for non-critical probes
    "DTZ003",   # datetime.utcnow used for epoch math everywhere
    "DTZ006",   # fromtimestamp without tz likewise
    "ASYNC210", # blocking calls in async wrapped/to-thread at call sites
    "ASYNC221", # subprocess run in async wrappers
    "RUF012",   # mutable class defaults on annotated fields are dataclass-standard
    "SIM102", "SIM105", "SIM108", "PERF402",  # cosmetic simplifications
    "UP035",    # py3.10 compat: keep typing.Dict/List for now
    "UP015", "PERF401", "PERF203", "RUF005", "PLW2901", "RUF006",
    "S311", "S310", "S324", "S602", "S603",  # audited: hashlib md5 for caching only; no untrusted URLs
    "S404", "S605", "S607",                  # subprocess imports & shell calls in tool wrappers
    "ASYNC240",                              # blocking path methods in async helpers
    "E701", "E722", "E741",                  # compact/bare-except style kept deliberate
    "UP031",    # %-format logging kept uniform across the codebase
    "UP006",    # py3.10: keep Tuple/typing aliases for now
    "S104",     # host=0.0.0.0 is opt-in via config, flagged and documented
    "S108",     # /tmp usage is sandbox-gated
    "S105", "S102", "S307",                  # exec/eval only inside the python-execution tool, intentional
    "S608",     # SQL is parameterized (set_clause built from whitelist); ruff can't see it
    "SIM115", "SIM116", "ASYNC230", "ASYNC110", "ASYNC220",  # targeted non-issues
    "PLW0603",  # singleton modules use module-level mutation deliberately
    "F811",     # method redefinition used for overload-by-name in state stores
    "E501",     # line length handled by formatter
    "F841",     # unused locals (intentional staging vars)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/plugin.py" = ["F401"]
"test_*.py" = ["S101"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# These files contain helper funcs named `test_pass`/`test_fail` that pytest
# mistakes for tests. conftest.py filters them out.
addopts = ["-p", "no:cacheprovider"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestReturnNotNoneWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
