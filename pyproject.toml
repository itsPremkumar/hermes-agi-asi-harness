[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agi-asi-harness"
version = "0.1.0"
description = "AGI/ASI Harness — Plugin & Hook System"
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "ddgs>=9.0.0",
    "psutil>=5.9.0",
    "aiofiles>=23.2.0",
    "mcp>=2.0.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "bandit>=1.7.0",
    "pip-audit>=2.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
mcp = [
    "mcp>=2.0",
]
all = [
    "hermes-agi-asi-harness[dev,api,mcp]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["archive/*", ".venv/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]
"benchmarks/**/__init__.py" = ["F401"]
"profiles/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
