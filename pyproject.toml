[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-agi-asi-harness"
version = "2.0.0"
description = "Hermes AGI/ASI Harness — free-first, modular, model-agnostic agent harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes AGI/ASI Contributors"},
]
keywords = ["agi", "asi", "agent", "harness", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black",
    "ruff",
    "mypy",
]
research = [
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
]
langgraph = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
]
deepagents = [
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
]
ollama = ["ollama>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
huggingface = ["transformers>=4.0", "torch>=2.0"]
browser = ["playwright>=1.40"]
all = [
    "ollama>=0.2",
    "openai>=1.0",
    "anthropic>=0.30",
    "transformers>=4.0",
    "playwright>=1.40",
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
]

[project.scripts]
hermes-agi = "hermes_agi:main"

[tool.setuptools.packages.find]
include = ["core*", "plugins*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
