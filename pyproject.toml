[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-agi-asi-harness"
version = "2.1.0"
description = "Hermes AGI/ASI Harness — free-first, modular, model-agnostic agent harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hermes AGI/ASI Contributors"},
]
keywords = ["agi", "asi", "agent", "harness", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "ddgs>=9.0.0",
    "psutil>=5.9.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black",
    "ruff",
    "mypy",
]
research = [
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
]
langgraph = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
]
deepagents = [
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
]
ollama = ["ollama>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
huggingface = ["transformers>=4.0", "torch>=2.0"]
browser = ["playwright>=1.40"]
all = [
    "ollama>=0.2",
    "openai>=1.0",
    "anthropic>=0.30",
    "transformers>=4.0",
    "playwright>=1.40",
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
]

[project.scripts]
hermes-agi = "hermes_agi:main"

[tool.setuptools]
py-modules = ["hermes_agi"]

[tool.setuptools.packages.find]
include = ["core*", "plugins*", "agents*", "tools*", "src*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = [".github/workflows"]

[tool.ruff.lint]
select = ["F", "E7", "E9", "UP", "SIM", "S", "ASYNC", "DTZ", "BLE", "PLW", "PERF", "RUF", "S506"]
ignore = [
    "BLE001", "S110", "S112", "S301", "PLW1510", "DTZ003", "DTZ006",
    "ASYNC210", "ASYNC221", "RUF012", "SIM102", "SIM105", "SIM108", "PERF402",
    "UP035", "UP015", "PERF401", "PERF203", "RUF005", "PLW2901", "RUF006",
    "S311", "S310", "S324", "S602", "S603", "S404", "S605", "S607", "ASYNC240",
    "E701", "E722", "E741", "UP031", "UP006", "S104", "S108", "S105", "S102", "S307",
    "S608", "SIM115", "SIM116", "ASYNC230", "ASYNC110", "ASYNC220",
    "PLW0603", "F811", "E501", "F841", "E701", "G004", "RUF059", "RUF013", "RUF015",
    "ASYNC250", "PLW0108", "PLW0602", "E702", "E712",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/plugin.py" = ["F401"]
"test_*.py" = ["S101"]
"scripts/*" = ["S"]
".github/workflows/*.yml" = ["E501", "F401", "F403", "F811", "F821", "F823", "E302", "E305", "E111", "E114", "E117", "E721", "E731", "E999"]
"install_for_hermes.py" = ["F401", "F403"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-p", "no:cacheprovider"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestReturnNotNoneWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
