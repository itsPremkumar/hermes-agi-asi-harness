name: Deploy Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== Pre-deploy Checks =====
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run full test suite
        run: pytest tests/ -x -q

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "import tomli; f=open('pyproject.toml','rb'); print(tomli.load(f)['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ===== Build & Push Docker =====
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Deploy Staging =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [preflight, docker]
    environment: staging
    if: github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying version ${{ needs.preflight.outputs.version }} to staging..."
          echo "Docker image: ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}"
          # Add actual deployment commands here (kubectl, helm, etc.)
          echo "Staging deployment complete!"

      - name: Health check
        run: |
          echo "Running health checks..."
          # curl -f https://staging.hermes-harness.ai/health || exit 1
          echo "Health checks passed!"

  # ===== Deploy Production =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [preflight, docker, deploy-staging]
    environment: production
    if: github.event.inputs.environment == 'production' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha'))
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.preflight.outputs.version }} to production..."
          echo "Docker image: ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}"
          # Add actual deployment commands here (kubectl, helm, etc.)
          echo "Production deployment complete!"

      - name: Health check
        run: |
          echo "Running health checks..."
          # curl -f https://hermes-harness.ai/health || exit 1
          echo "Health checks passed!"

      - name: Smoke test
        run: |
          echo "Running smoke tests..."
          # python -m pytest tests/smoke/ -v || exit 1
          echo "Smoke tests passed!"

  # ===== Publish to PyPI =====
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [preflight, deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ===== Create GitHub Release =====
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [preflight, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # ===== Notify =====
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production, publish-pypi, release]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "Deployment status: ${{ needs.deploy-production.result }}"
          echo "PyPI publish status: ${{ needs.publish-pypi.result }}"
          echo "Release status: ${{ needs.release.result }}"
