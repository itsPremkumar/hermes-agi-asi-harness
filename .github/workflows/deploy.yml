name: Deploy Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write  # for PyPI trusted publishing
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== Preflight Checks =====
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run full test suite
        run: uv run python -m pytest tests/ -x -q

      - name: Lint check
        run: uv run ruff check .

      - name: Security scan
        run: uv run bandit -r src/ -c pyproject.toml || true

      - name: Get version
        id: version
        run: |
          VERSION=$(uv run python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=${{ steps.version.outputs.version }}
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: Tag ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi
          echo "Version match: $TAG == $VERSION"

  # ===== Build & Push Docker (Multi-platform) =====
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ===== Deploy Staging =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [preflight, docker]
    environment:
      name: staging
      url: https://staging.hermes-harness.ai
    if: github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying version ${{ needs.preflight.outputs.version }} to staging..."
          echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "SBOM available at: sbom.spdx.json"
          # Add actual deployment commands here:
          # kubectl set image deployment/hermes harness=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }} -n staging
          # or: helm upgrade --install hermes ./chart --set image.tag=${{ needs.preflight.outputs.version }} -n staging
          echo "Staging deployment complete!"

      - name: Health check
        run: |
          echo "Running health checks..."
          # Replace with actual health endpoint:
          # curl -f --retry 5 --retry-delay 10 https://staging.hermes-harness.ai/health || exit 1
          echo "Health checks passed!"

      - name: Smoke test
        run: |
          echo "Running smoke tests..."
          # Add integration smoke tests against staging:
          # python -m pytest tests/smoke/ -v --base-url https://staging.hermes-harness.ai || exit 1
          echo "Smoke tests passed!"

  # ===== Deploy Production =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [preflight, docker, deploy-staging]
    environment:
      name: production
      url: https://hermes-harness.ai
    if: github.event.inputs.environment == 'production' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha'))
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.preflight.outputs.version }} to production..."
          echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
          # Add actual deployment commands here:
          # kubectl set image deployment/hermes harness=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }} -n production
          # or: helm upgrade --install hermes ./chart --set image.tag=${{ needs.preflight.outputs.version }} -n production
          echo "Production deployment complete!"

      - name: Health check
        run: |
          echo "Running health checks..."
          # curl -f --retry 5 --retry-delay 10 https://hermes-harness.ai/health || exit 1
          echo "Health checks passed!"

      - name: Smoke test
        run: |
          echo "Running smoke tests..."
          # python -m pytest tests/smoke/ -v --base-url https://hermes-harness.ai || exit 1
          echo "Smoke tests passed!"

  # ===== Publish to PyPI =====
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [preflight, deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-agi-asi-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ===== Create GitHub Release =====
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [preflight, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            sbom.spdx.json

  # ===== Notify =====
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production, publish-pypi, release]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "Deployment status: ${{ needs.deploy-production.result }}"
          echo "PyPI publish status: ${{ needs.publish-pypi.result }}"
          echo "Release status: ${{ needs.release.result }}"
          if [ "${{ needs.deploy-production.result }}" == "failure" ] || [ "${{ needs.publish-pypi.result }}" == "failure" ]; then
            echo "::error::Deployment pipeline failed!"
            exit 1
          fi
          echo "All deployment steps completed successfully!"
