name: Hermes AGI/ASI Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      - name: Ruff lint
        run: uv run ruff check . --fix
      - name: Import check
        shell: bash
        run: uv run python scripts/verify_imports.py
      - name: Pytest
        shell: bash
        run: uv run python -m pytest -q tests/
      - name: Upload results
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results/
            .coverage*

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Build package
        run: uv build
      - name: Verify imports
        shell: bash
        run: uv run python scripts/verify_imports.py
