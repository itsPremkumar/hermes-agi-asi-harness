name: Nightly Build

on:
  schedule:
    # Run at 2 AM UTC every night
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== Full Test Suite (extended) =====
  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run full test suite
        run: uv run python -m pytest tests/ -v --tb=long -x

      - name: Run with coverage
        run: |
          uv run python -m pytest tests/ \
            --cov=src/harness \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: coverage.xml

  # ===== Nightly Docker Build =====
  nightly-docker:
    name: Nightly Docker Build
    runs-on: ubuntu-latest
    needs: full-tests
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
            type=sha,prefix=nightly-

      - name: Build and push nightly
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Dependency Health Check =====
  dependency-check:
    name: Dependency Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check for outdated packages
        run: |
          echo "=== Installed packages ==="
          uv pip list --format=columns

          echo ""
          echo "=== Outdated packages ==="
          uv pip list --outdated --format=columns || true

      - name: Check for vulnerabilities
        run: |
          uv run pip-audit -r requirements.txt --strict || echo "Vulnerabilities found (see log above)"

  # ===== Notify on Failure =====
  notify-failure:
    name: Notify on Failure
    needs: [full-tests, nightly-docker, dependency-check]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "::error::Nightly build failed!"
          echo "Check the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Failed job: ${{ needs.full-tests.result == 'failure' && 'full-tests' || needs.nightly-docker.result == 'failure' && 'nightly-docker' || 'dependency-check' }}"
