# Hermes AGI/ASI Harness — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hermes-production
    environment: production

# Alerting rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Hermes main service
  - job_name: 'hermes'
    metrics_path: /metrics
    static_configs:
      - targets: ['hermes:8000']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
