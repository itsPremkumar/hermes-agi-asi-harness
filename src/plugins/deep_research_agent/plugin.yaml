name: deep_research_agent
version: 3.0.0
description: "Unified Deep Research Agent — combines AgentEye search + LangGraph orchestration + DeepAgents pattern + recursive research"
license: MIT
source: internal
capabilities:
  - deep_research
  - web_search
  - content_extraction
  - citation_validation
  - contradiction_detection
  - recursive_research
  - multi_agent
  - sub_agent
  - evidence_synthesis
  - source_ranking
cost:
  default: free
permissions:
  filesystem:
    read: workspace
    write: workspace
  network:
    allowed:
      - "*"
  shell:
    allowed: []
  secrets:
    access: none
  max_memory_mb: 2048
  max_cpu_percent: 80
