name: observability
version: 1.0.0
description: Observability & Evaluation Pipeline with LangSmith integration
author: devops-engineer
capabilities:
  - metrics_collection
  - distributed_tracing
  - benchmark_evaluation
  - langsmith_integration
  - report_generation
